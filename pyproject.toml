[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-codex-agent"
version = "0.2.0"
description = "Persistent Telegram personal AI agent with Codex, Ajil, voice, and host tools"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "aiogram>=3.13,<4",
  "aiofiles>=24.1,<25",
  "alembic>=1.14,<2",
  "asyncpg>=0.30,<1",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "orjson>=3.10,<4",
  "prometheus-client>=0.21,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.6,<3",
  "PyYAML>=6.0,<7",
  "python-dotenv>=1.0,<2",
  "python-multipart>=0.0.20,<1",
  "redis>=5.2,<6",
  "SQLAlchemy>=2.0.36,<3",
  "structlog>=24.4,<26",
  "telethon>=1.44,<2",
  "tenacity>=9.0,<10",
  "typer>=0.15,<1",
  "uvicorn[standard]>=0.32,<1",
  "pysocks>=1.7,<2",
  "python-socks[asyncio]>=2.5,<3",
  "py-tgcalls[telethon]>=2.3,<3",
  # Pin the audio client and its async transport for reproducible container builds.
  "edge-tts==7.2.8",
  "aiohttp==3.14.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.23,<1",
  "pytest-cov>=6,<7",
  "respx>=0.22,<1",
  "ruff>=0.8",
  "mypy>=1.13",
  "types-PyYAML>=6.0.12",
]

[project.scripts]
telegram-voice-agent = "voice_agent.cli:main"
agentctl = "telegram_codex_agent.cli:main"
telegram-codex-agent = "telegram_codex_agent.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "tests_agent"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Typed transport schemas necessarily use wide signatures; Typer uses Option factories.
"src/telegram_codex_agent/**/*.py" = ["E501", "B008", "RUF001", "UP017", "UP042"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["voice_agent", "telegram_codex_agent"]

[[tool.mypy.overrides]]
module = ["telethon.*", "pytgcalls.*", "ntgcalls"]
ignore_missing_imports = true
