services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-telegram_codex_agent}
      POSTGRES_USER: ${POSTGRES_USER:-agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agent_dev_password}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: uag-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-16379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  ajil_gateway:
    build:
      context: ./modules/ajil_uag
      dockerfile: Dockerfile
      network: ${UAG_DOCKER_BUILD_NETWORK:-default}
      args:
        HTTP_PROXY: ${UAG_BUILD_HTTP_PROXY:-}
        HTTPS_PROXY: ${UAG_BUILD_HTTPS_PROXY:-}
        ALL_PROXY: ${UAG_BUILD_ALL_PROXY:-}
        NO_PROXY: ${UAG_BUILD_NO_PROXY:-}
        PIP_INDEX_URL: ${UAG_PIP_INDEX_URL:-}
        PIP_EXTRA_INDEX_URL: ${UAG_PIP_EXTRA_INDEX_URL:-}
    env_file: .env
    environment:
      UAG_ENV_FILE: /dev/null
      UAG_REDIS_URL: redis://redis:6379/0
      # The root .env may use a host-loopback proxy for bare-metal runs; use
      # its Docker-specific endpoint when the gateway runs in this network.
      UAG_PROXY_URL: ${UAG_PROXY_URL_DOCKER:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:${AJIL_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5).read()"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 15s

  voice-agent:
    build:
      context: .
      network: ${UAG_DOCKER_BUILD_NETWORK:-default}
      args:
        HTTP_PROXY: ${UAG_BUILD_HTTP_PROXY:-}
        HTTPS_PROXY: ${UAG_BUILD_HTTPS_PROXY:-}
        ALL_PROXY: ${UAG_BUILD_ALL_PROXY:-}
        NO_PROXY: ${UAG_BUILD_NO_PROXY:-}
        PIP_INDEX_URL: ${UAG_PIP_INDEX_URL:-}
        PIP_EXTRA_INDEX_URL: ${UAG_PIP_EXTRA_INDEX_URL:-}
    profiles: ["agent"]
    restart: unless-stopped
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      UAG_BASE_URL: http://ajil_gateway:8080
      RUNTIME_DIR: /runtime
      AUDIT_DATABASE_PATH: /runtime/voice_agent.sqlite3
      AUDIT_JSONL_PATH: /runtime/events.jsonl
      TELEGRAM_PROXY_HOST: ${TELEGRAM_PROXY_HOST_DOCKER:-host.docker.internal}
      TELEGRAM_PROXY_PORT: ${TELEGRAM_PROXY_PORT_DOCKER:-0}
      # The existing Telethon owner consumes durable terminal notifications;
      # no second client is allowed to open the same string session.
      CODEX_COMPLETION_CALL_REDIS_URL: redis://redis:6379/1
    volumes:
      - ./runtime:/runtime
    depends_on:
      ajil_gateway:
        condition: service_healthy
    command: ["serve"]

  # Persistent Telegram Codex platform. Its workspace path is explicit and
  # never supplied by Telegram input; the legacy Telethon voice stack above is
  # intentionally independent.
  agent-migrate:
    image: ${AGENT_IMAGE:-octopus-agent-platform:latest}
    build:
      context: .
      dockerfile: Dockerfile.agent
      network: ${UAG_DOCKER_BUILD_NETWORK:-default}
      args:
        HTTP_PROXY: ${UAG_BUILD_HTTP_PROXY:-}
        HTTPS_PROXY: ${UAG_BUILD_HTTPS_PROXY:-}
        ALL_PROXY: ${UAG_BUILD_ALL_PROXY:-}
        NO_PROXY: ${UAG_BUILD_NO_PROXY:-}
    profiles: ["agent"]
    entrypoint: []
    working_dir: /workspace/octopus
    restart: "no"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://agent:${POSTGRES_PASSWORD:-agent_dev_password}@postgres:5432/${POSTGRES_DB:-telegram_codex_agent}
      REDIS_URL: redis://redis:6379/1
      AJIL_BASE_URL: http://ajil_gateway:8080
      PROJECT_OCTOPUS_ROOT: /workspace/octopus
      CODEX_HOME: /codex-home
      CODEX_BINARY: /host-codex/bin/codex
      PATH: /host-codex/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      PYTHONPATH: /workspace/octopus/src
    volumes:
      - .:/workspace/octopus
      - ${CODEX_HOME_HOST:-/home/mhr/.codex}:/codex-home
      - ${CODEX_HOST_RUNTIME:-/home/mhr/.nvm/versions/node/v22.19.0}:/host-codex:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]

  agent-api:
    image: ${AGENT_IMAGE:-octopus-agent-platform:latest}
    build:
      context: .
      dockerfile: Dockerfile.agent
      network: ${UAG_DOCKER_BUILD_NETWORK:-default}
      args:
        HTTP_PROXY: ${UAG_BUILD_HTTP_PROXY:-}
        HTTPS_PROXY: ${UAG_BUILD_HTTPS_PROXY:-}
        ALL_PROXY: ${UAG_BUILD_ALL_PROXY:-}
        NO_PROXY: ${UAG_BUILD_NO_PROXY:-}
    profiles: ["agent"]
    entrypoint: []
    working_dir: /workspace/octopus
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://agent:${POSTGRES_PASSWORD:-agent_dev_password}@postgres:5432/${POSTGRES_DB:-telegram_codex_agent}
      REDIS_URL: redis://redis:6379/1
      AJIL_BASE_URL: http://ajil_gateway:8080
      AGENT_API_HOST: 0.0.0.0
      PROJECT_OCTOPUS_ROOT: /workspace/octopus
      WORKSPACE_ROOT: /workspace/code
      CODEX_HOME: /codex-home
      CODEX_BINARY: /host-codex/bin/codex
      PATH: /host-codex/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      PYTHONPATH: /workspace/octopus/src
    volumes:
      - .:/workspace/octopus
      - ${WORKSPACE_ROOT_HOST:-/home/mhr/Code}:/workspace/code
      - ${CODEX_HOME_HOST:-/home/mhr/.codex}:/codex-home
      - ${CODEX_HOST_RUNTIME:-/home/mhr/.nvm/versions/node/v22.19.0}:/host-codex:ro
    ports:
      - "127.0.0.1:${AGENT_API_PORT:-18090}:18090"
    depends_on:
      agent-migrate:
        condition: service_completed_successfully
      ajil_gateway:
        condition: service_healthy
    command: ["python", "-m", "telegram_codex_agent.cli", "api"]

  agent-worker:
    image: ${AGENT_IMAGE:-octopus-agent-platform:latest}
    build:
      context: .
      dockerfile: Dockerfile.agent
      network: ${UAG_DOCKER_BUILD_NETWORK:-default}
      args:
        HTTP_PROXY: ${UAG_BUILD_HTTP_PROXY:-}
        HTTPS_PROXY: ${UAG_BUILD_HTTPS_PROXY:-}
        ALL_PROXY: ${UAG_BUILD_ALL_PROXY:-}
        NO_PROXY: ${UAG_BUILD_NO_PROXY:-}
    profiles: ["agent"]
    entrypoint: []
    working_dir: /workspace/octopus
    network_mode: host
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://agent:${POSTGRES_PASSWORD:-agent_dev_password}@127.0.0.1:${POSTGRES_PORT:-15432}/${POSTGRES_DB:-telegram_codex_agent}
      REDIS_URL: redis://127.0.0.1:${REDIS_PORT:-16379}/1
      AJIL_BASE_URL: http://127.0.0.1:${AJIL_PORT:-8080}
      PROJECT_OCTOPUS_ROOT: /workspace/octopus
      WORKSPACE_ROOT: /workspace/code
      CODEX_HOME: /codex-home
      CODEX_BINARY: /host-codex/bin/codex
      PATH: /host-codex/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      PYTHONPATH: /workspace/octopus/src
      TELEGRAM_BOT_PROXY_URL: ${TELEGRAM_BOT_PROXY_URL:-http://127.0.0.1:3128}
      # Codex's App Server makes authenticated outbound requests itself.  It
      # therefore needs the host-reachable CONNECT proxy independently of the
      # Bot API session above.
      HTTP_PROXY: ${CODEX_HTTP_PROXY_URL:-http://127.0.0.1:3128}
      HTTPS_PROXY: ${CODEX_HTTP_PROXY_URL:-http://127.0.0.1:3128}
      NO_PROXY: 127.0.0.1,localhost
    volumes:
      - .:/workspace/octopus
      - ${WORKSPACE_ROOT_HOST:-/home/mhr/Code}:/workspace/code
      - ${CODEX_HOME_HOST:-/home/mhr/.codex}:/codex-home
      - ${CODEX_HOST_RUNTIME:-/home/mhr/.nvm/versions/node/v22.19.0}:/host-codex:ro
    depends_on:
      agent-migrate:
        condition: service_completed_successfully
      ajil_gateway:
        condition: service_healthy
    command:
      [
        "sh",
        "-lc",
        "git config --global --add safe.directory '/workspace/code/*' && git config --global --add safe.directory /workspace/octopus && exec python -m telegram_codex_agent.runtime worker",
      ]

  agent-bot:
    image: ${AGENT_IMAGE:-octopus-agent-platform:latest}
    build:
      context: .
      dockerfile: Dockerfile.agent
      network: ${UAG_DOCKER_BUILD_NETWORK:-default}
      args:
        HTTP_PROXY: ${UAG_BUILD_HTTP_PROXY:-}
        HTTPS_PROXY: ${UAG_BUILD_HTTPS_PROXY:-}
        ALL_PROXY: ${UAG_BUILD_ALL_PROXY:-}
        NO_PROXY: ${UAG_BUILD_NO_PROXY:-}
    profiles: ["agent"]
    entrypoint: []
    working_dir: /workspace/octopus
    network_mode: host
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://agent:${POSTGRES_PASSWORD:-agent_dev_password}@127.0.0.1:${POSTGRES_PORT:-15432}/${POSTGRES_DB:-telegram_codex_agent}
      REDIS_URL: redis://127.0.0.1:${REDIS_PORT:-16379}/1
      AJIL_BASE_URL: http://127.0.0.1:${AJIL_PORT:-8080}
      PROJECT_OCTOPUS_ROOT: /workspace/octopus
      WORKSPACE_ROOT: /workspace/code
      CODEX_HOME: /codex-home
      CODEX_BINARY: /host-codex/bin/codex
      PATH: /host-codex/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      PYTHONPATH: /workspace/octopus/src
      TELEGRAM_BOT_PROXY_URL: ${TELEGRAM_BOT_PROXY_URL:-http://127.0.0.1:3128}
      # `/usage` queries the authenticated Codex App Server directly.
      HTTP_PROXY: ${CODEX_HTTP_PROXY_URL:-http://127.0.0.1:3128}
      HTTPS_PROXY: ${CODEX_HTTP_PROXY_URL:-http://127.0.0.1:3128}
      NO_PROXY: 127.0.0.1,localhost
    volumes:
      - .:/workspace/octopus
      - ${WORKSPACE_ROOT_HOST:-/home/mhr/Code}:/workspace/code
      - ${CODEX_HOME_HOST:-/home/mhr/.codex}:/codex-home
      - ${CODEX_HOST_RUNTIME:-/home/mhr/.nvm/versions/node/v22.19.0}:/host-codex:ro
    depends_on:
      agent-migrate:
        condition: service_completed_successfully
      ajil_gateway:
        condition: service_healthy
    command: ["python", "-m", "telegram_codex_agent.runtime", "bot"]

  # The SSH transport is deliberately routed through the existing HTTP proxy
  # (host.docker.internal:32080 -> host port 3128). It exposes no host port.
  voice-media-ssh-tunnel:
    build:
      context: .
      dockerfile: Dockerfile.media-ssh-tunnel
      network: ${UAG_DOCKER_BUILD_NETWORK:-default}
      args:
        HTTP_PROXY: ${UAG_BUILD_HTTP_PROXY:-}
        HTTPS_PROXY: ${UAG_BUILD_HTTPS_PROXY:-}
        ALL_PROXY: ${UAG_BUILD_ALL_PROXY:-}
        NO_PROXY: ${UAG_BUILD_NO_PROXY:-}
    profiles: ["agent"]
    restart: unless-stopped
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${VOICE_AGENT_MEDIA_SSH_KEY_PATH:-/root/.ssh/id_ed25519_tunnel}:/run/ssh-key:ro
      - ${VOICE_AGENT_MEDIA_SSH_KNOWN_HOSTS_PATH:-/root/.ssh/known_hosts}:/run/ssh-known-hosts:ro
    environment:
      VOICE_AGENT_MEDIA_SSH_KEY_PATH: /run/ssh-key
      VOICE_AGENT_MEDIA_SSH_KNOWN_HOSTS_PATH: /run/ssh-known-hosts
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 $$VOICE_AGENT_MEDIA_SSH_FORWARD_PORT"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

  # Shares its network namespace with voice-agent so TPROXY captures the
  # agent's locally-originated media UDP without changing PyTgCalls code.
  voice-media-tunnel:
    image: ${VOICE_AGENT_MEDIA_GOST_IMAGE:-gogost/gost:3}
    profiles: ["agent"]
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./scripts/media_tunnel.sh:/usr/local/bin/media-tunnel:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/media-tunnel"]
    depends_on:
      voice-media-ssh-tunnel:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "ip rule show | grep -q 'fwmark' && iptables -t mangle -S VOICE_AGENT_GOST | grep -q TPROXY",
        ]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

  # Optional local Bot API endpoint. Native bot polling remains the default.
  local_telegram_bot_api:
    image: aiogram/telegram-bot-api:latest
    profiles: ["local_telegram_bot_api"]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    profiles: ["prometheus"]
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    image: grafana/grafana:latest
    profiles: ["grafana"]
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  postgres-data:
  redis-data:
